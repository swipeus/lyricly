<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lyricly" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Lyricly — Şarkılarla İngilizce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">🎧 <span>Lyricly</span></a>
    <nav class="nav">
      <a href="#/" data-nav="home"><i>🏠</i><span>Ana Sayfa</span></a>
      <a href="#/add" data-nav="add"><i>➕</i><span>Şarkı Ekle</span></a>
      <a href="#/vocab" data-nav="vocab"><i>📒</i><span>Kelime Defteri</span> <span id="dueBadge" class="badge hidden"></span></a>
    </nav>
    <div class="hud">
      <div class="hud-item" title="Günlük seri"><span class="flame">🔥</span><b id="hudStreak">0</b></div>
      <div class="hud-item hud-xp" title="Seviye ve XP">
        <span class="lvl">Sv <b id="hudLevel">1</b></span>
        <div class="xpbar"><div id="hudXpFill"></div></div>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <!-- Word lookup popover -->
  <div id="wordPop" class="wordpop hidden"></div>
  <div id="toasts"></div>
  <canvas id="confetti"></canvas>

  <!-- Plain ES5 on purpose: if app.js fails to load or parse on an older phone, this still runs and says why -->
  <script>
    window.__errs = [];
    window.addEventListener('error', function (e) {
      if (e && e.message && e.message !== 'Script error.') window.__errs.push(e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')');
    }, true);
    setTimeout(function () {
      if (window.__lyriclyOK) return;
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:12px;right:12px;top:80px;z-index:99;background:#3a1020;color:#fff;border:1px solid #ff5c6c;padding:14px;border-radius:12px;font:14px/1.5 system-ui,sans-serif';
      d.textContent = 'Uygulama yüklenemedi. Bu ekranın görüntüsünü gönder: ' + (window.__errs.join(' | ') || 'hata yok') + ' — ' + navigator.userAgent;
      document.body.appendChild(d);
    }, 5000);
  </script>
  <script src="app.js?v=8"></script>
</body>
</html>
